[package]
name = "sfu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
rand = "0.9"
rtc = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21.1"
